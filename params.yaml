evaluation:
  positive_threshold: 4.0
  train_end: "2022-01-01T00:00:00Z"
  validation_end: "2023-01-01T00:00:00Z"

als:
  k: 10
  trials:
    - name: als_32
      factors: 32
      regularization: 0.1
      alpha: 20.0
      iterations: 30
      random_state: 42
      num_threads: 1
    - name: als_64
      factors: 64
      regularization: 0.1
      alpha: 20.0
      iterations: 30
      random_state: 42
      num_threads: 1
    - name: als_32_regularized
      factors: 32
      regularization: 1.0
      alpha: 20.0
      iterations: 30
      random_state: 42
      num_threads: 1

tracking:
  uri: sqlite:///mlruns.db

promotion:
  k: 10
  # On MovieLens 32M, five seeds of als_64 on the 5,599 validation users gave
  # standard deviations of 0.0009 for NDCG@10 and 0.0008 for Recall@10: a
  # candidate may lose a little more than two of them before it is refused.
  ndcg_tolerance: 0.002
  recall_tolerance: 0.002
  # Top-10 catalog coverage varied by 0.5 % between seeds; popularity and a
  # degraded model reach about 5 % of the ALS coverage.
  min_coverage_ratio: 0.9
  # Both p95 latencies are measured in the same job; between runs on one
  # machine they varied from 14 to 24 ms.
  max_latency_ratio: 2.0
  # Far fewer users would mean that the split or the data changed shape.
  min_validation_users: 1000
