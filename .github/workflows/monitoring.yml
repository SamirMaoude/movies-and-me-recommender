name: Input comparison

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      current_hours:
        description: Length of the window to check, in hours
        default: "24"
      reference_hours:
        description: Length of the reference window just before it, in hours
        default: "168"

permissions:
  contents: read

jobs:
  compare:
    name: Compare live inputs with the reference period
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: monitoring
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-monitoring.txt
      - name: Install the CloudWatch client
        run: python -m pip install -r requirements-monitoring.txt
      - name: Get read access to the metrics
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_MONITORING_ROLE_ARN }}
          aws-region: eu-north-1
          mask-aws-account-id: true
      - name: Compare the inputs
        # The job fails when the inputs changed, so GitHub sends an email.
        env:
          CURRENT_HOURS: ${{ inputs.current_hours || '24' }}
          REFERENCE_HOURS: ${{ inputs.reference_hours || '168' }}
        run: |
          set -o pipefail
          python scripts/compare_inputs.py --current-hours "$CURRENT_HOURS" \
            --reference-hours "$REFERENCE_HOURS" | tee -a "$GITHUB_STEP_SUMMARY"
